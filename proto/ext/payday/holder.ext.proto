edition = "2023";

package payday;

// What this app adds to payday's Holder.
//
// An overlay may only **add**, and only in the numbers payday left free: 8..12
// and from 16. Generation refuses one that redeclares a number payday owns,
// because the merge would take the overlay's word and `alias` would quietly
// become whatever it said.
//
// # What belongs here, and what does not
//
// One question decides it: **does this fact exist outside custody?**
//
// Who somebody is, what they are called, which addresses they use, which
// external identities they sign in with -- all of that exists whether custody
// does or not, and it lives in roster. A row here is a **local anchor**: the
// identifier, so that `Asset.keeper` has something to point at and the trail
// has somebody to name, and nothing else.
//
// What would belong here is something true only in custody -- whether this
// person is certified to handle a particular class of asset, say. There is
// nothing yet, and an empty overlay is the honest state rather than a place to
// keep a copy of roster.
//
// Delete this file if there is nothing to add. The same works for `tenant` and
// `audit`, named the same way.
message Holder {}
